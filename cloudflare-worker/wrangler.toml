name = "chekinana-runpod-proxy"
main = "src/worker.js"
compatibility_date = "2026-06-12"

routes = [
  { pattern = "api.chekinana.top/*", zone_name = "chekinana.top" }
]

[vars]
NL_LLM_MODEL = "deepseek-v4-flash"
NL_LLM_ENDPOINT = "https://api.deepseek.com/chat/completions"
CHEKI_DATE_QWEN_MODEL = "qwen3.7-plus"

[[ratelimits]]
name = "NL_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "EVENT_WEIBO_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "CHEKI_DATE_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 5
  period = 60
